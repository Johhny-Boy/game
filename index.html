<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Flash Game Loader</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
        }
        #player { width: 100%; height: 100%; }
    </style>
    <!-- Loads the absolute latest version of the Ruffle engine -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="player"></div>

    <script>
        // Updated initialization script matching Ruffle's latest framework
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest ? window.RufflePlayer.newest() : window.ruffle;
            if (ruffle) {
                const player = ruffle.createPlayer();
                const container = document.getElementById("player");
                container.appendChild(player);
                
                // Loads your game file safely
                player.load("game.swf");
            } else {
                console.error("Ruffle failed to initialize properly.");
            }
        });
    </script>

</body>
</html>
